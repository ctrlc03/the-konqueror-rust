[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/server",
    "crates/client",
    "crates/listener-http",
    "crates/implant",
    "crates/storage",
]

[workspace.dependencies]
konqueror-common = { path = "crates/common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
axum = "0.8.9"
clap = "4.6.1"
async-trait = "0.1.89"
